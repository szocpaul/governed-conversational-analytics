name: itsm-foundation

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  graphjin:
    image: dosco/graphjin:3.21.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GO_ENV: dev
    command: ["serve", "--path", "/config"]
    volumes:
      # GraphJin writes managed state (artifact SQLite, discovery snapshots)
      # under <config>/.graphjin/, so the mount must be writable. The governed
      # policy files themselves are protected by host file permissions and Git.
      - ./graphjin/config:/config
    ports:
      - "127.0.0.1:${GRAPHJIN_PORT:-8081}:8080"
    # The distroless image has no shell/wget/curl, so no container-level
    # healthcheck is possible; readiness is verified by polling /healthz
    # from the host (see tests/integration/test_graphjin_queries.py).

volumes:
  postgres-data:
