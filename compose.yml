name: itsm-foundation

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  graphjin:
    image: dosco/graphjin:3.21.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # GraphJin reads config from /config; database URL comes from dev.yml env expansion
      GRAPHJIN_DB_URL: postgres://${GRAPHJIN_DB_USER:?set GRAPHJIN_DB_USER in .env}:${GRAPHJIN_DB_PASSWORD:?set GRAPHJIN_DB_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-itsm}?sslmode=disable
    volumes:
      - ./graphjin/config:/config:ro
    ports:
      - "127.0.0.1:${GRAPHJIN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres-data:
